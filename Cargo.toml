[package]
name = "xahau-decoder"
version = "2.3.0"
edition = "2021"
description = "Fast binary decoder for Xahau ledger data"

[lib]
crate-type = ["cdylib"]

[dependencies]
# napi-rs for Node.js bindings
napi = { version = "2", features = ["napi9", "serde-json"] }
napi-derive = "2"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Binary parsing
hex = "0.4"

# Hashing (for account ID encoding)
sha2 = "0.10"

# Big integer for base58 encoding
num-bigint = "0.4"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
